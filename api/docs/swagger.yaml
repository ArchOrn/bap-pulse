basePath: /
definitions:
  db.Match:
    properties:
      id:
        type: string
      match_type:
        $ref: '#/definitions/db.MatchType'
      played_at:
        $ref: '#/definitions/pgtype.Timestamptz'
      score_team1:
        type: integer
      score_team2:
        type: integer
      team1_player1_id:
        type: string
      team1_player2_id:
        $ref: '#/definitions/pgtype.Text'
      team2_player1_id:
        type: string
      team2_player2_id:
        $ref: '#/definitions/pgtype.Text'
      validated:
        type: boolean
    type: object
  db.MatchType:
    enum:
    - SINGLES
    - DOUBLES
    - MIXED
    type: string
    x-enum-varnames:
    - MatchTypeSINGLES
    - MatchTypeDOUBLES
    - MatchTypeMIXED
  db.User:
    properties:
      created_at:
        $ref: '#/definitions/pgtype.Timestamptz'
      elo:
        type: integer
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      role:
        type: string
    type: object
  handlers.createMatchRequest:
    properties:
      match_type:
        description: SINGLES | DOUBLES | MIXED
        type: string
      score_team1:
        type: integer
      score_team2:
        type: integer
      team1_player1_id:
        description: always required
        type: string
      team1_player2_id:
        description: required for DOUBLES / MIXED
        type: string
      team2_player1_id:
        description: always required
        type: string
      team2_player2_id:
        description: required for DOUBLES / MIXED
        type: string
    type: object
  handlers.inviteRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
    type: object
  handlers.inviteResponse:
    properties:
      temp_password:
        type: string
      user:
        $ref: '#/definitions/db.User'
    type: object
  handlers.setRoleRequest:
    properties:
      admin:
        type: boolean
    type: object
  handlers.syncRequest:
    properties:
      first_name:
        type: string
      last_name:
        type: string
    type: object
  handlers.updateUserRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
    type: object
  pgtype.InfinityModifier:
    enum:
    - 1
    - 0
    - -1
    format: int32
    type: integer
    x-enum-varnames:
    - Infinity
    - Finite
    - NegativeInfinity
  pgtype.Text:
    properties:
      string:
        type: string
      valid:
        type: boolean
    type: object
  pgtype.Timestamptz:
    properties:
      infinityModifier:
        $ref: '#/definitions/pgtype.InfinityModifier'
      time:
        type: string
      valid:
        type: boolean
    type: object
  services.UserRanking:
    properties:
      rank:
        type: integer
      user:
        $ref: '#/definitions/db.User'
    type: object
host: localhost:8080
info:
  contact: {}
  description: REST API for the BAP Pulse badminton club app — Bad A Paname.
  title: BAP Pulse API
  version: "1.0"
paths:
  /admin/invite:
    post:
      consumes:
      - application/json
      description: Creates a Firebase user and their profile. Returns a temporary
        password to share with the new user.
      parameters:
      - description: User first name, last name and email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.inviteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.inviteResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Invite a new user
      tags:
      - admin
  /admin/users/{uid}/role:
    post:
      consumes:
      - application/json
      description: Updates the user's role in the database. Takes effect immediately
        on the next request (no token refresh needed).
      parameters:
      - description: Firebase UID of the target user
        in: path
        name: uid
        required: true
        type: string
      - description: Role payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.setRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/db.User'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Grant or revoke admin role
      tags:
      - admin
  /auth/sync:
    post:
      consumes:
      - application/json
      description: Called after a successful Firebase login. Creates the user profile
        on first login, or returns the existing one.
      parameters:
      - description: User first and last name (required on first login)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.syncRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/db.User'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/db.User'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Sync user profile
      tags:
      - auth
  /matches:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/db.Match'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List all matches
      tags:
      - matches
    post:
      consumes:
      - application/json
      description: 'Creates a match, recalculates ELO ratings, and records history.
        Singles: provide team1_player1_id and team2_player1_id only. Doubles/Mixed:
        provide all 4 player IDs.'
      parameters:
      - description: Match details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.createMatchRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a match
      tags:
      - matches
  /matches/{id}:
    get:
      parameters:
      - description: Match ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/db.Match'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get a match
      tags:
      - matches
  /rankings:
    get:
      description: Returns all users sorted by descending ELO with their rank position.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/services.UserRanking'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: ELO leaderboard
      tags:
      - rankings
  /users:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/db.User'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List all users
      tags:
      - users
  /users/{id}:
    delete:
      description: Only the authenticated user can delete their own account.
      parameters:
      - description: User ID (Firebase UID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete user account
      tags:
      - users
    get:
      parameters:
      - description: User ID (Firebase UID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/db.User'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get a user
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Only the authenticated user can update their own profile.
      parameters:
      - description: User ID (Firebase UID)
        in: path
        name: id
        required: true
        type: string
      - description: Updated user data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.updateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/db.User'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update user profile
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: 'Firebase ID Token — format: Bearer <token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"

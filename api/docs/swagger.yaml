basePath: /
definitions:
  db.Challenge:
    properties:
      court:
        $ref: '#/definitions/pgtype.Text'
      created_at:
        $ref: '#/definitions/pgtype.Timestamptz'
      from_user_id:
        type: string
      id:
        type: string
      match_type:
        $ref: '#/definitions/db.MatchType'
      note:
        $ref: '#/definitions/pgtype.Text'
      proposed_at:
        $ref: '#/definitions/pgtype.Timestamptz'
      responded_at:
        $ref: '#/definitions/pgtype.Timestamptz'
      status:
        $ref: '#/definitions/db.ChallengeStatus'
      to_user_id:
        type: string
    type: object
  db.ChallengeStatus:
    enum:
    - PENDING
    - ACCEPTED
    - DECLINED
    - EXPIRED
    - CANCELLED
    type: string
    x-enum-varnames:
    - ChallengeStatusPENDING
    - ChallengeStatusACCEPTED
    - ChallengeStatusDECLINED
    - ChallengeStatusEXPIRED
    - ChallengeStatusCANCELLED
  db.ClubRoster:
    properties:
      cote_doubles:
        $ref: '#/definitions/pgtype.Int4'
      cote_mixed:
        $ref: '#/definitions/pgtype.Int4'
      cote_singles:
        $ref: '#/definitions/pgtype.Int4'
      first_name:
        type: string
      gender:
        $ref: '#/definitions/pgtype.Text'
      is_data_public:
        type: boolean
      last_name:
        type: string
      license_number:
        type: string
      matched_user_id:
        $ref: '#/definitions/pgtype.Text'
      per_id:
        $ref: '#/definitions/pgtype.Text'
      rank_doubles:
        $ref: '#/definitions/pgtype.Text'
      rank_mixed:
        $ref: '#/definitions/pgtype.Text'
      rank_singles:
        $ref: '#/definitions/pgtype.Text'
      synced_at:
        $ref: '#/definitions/pgtype.Timestamptz'
    type: object
  db.FcmToken:
    properties:
      created_at:
        $ref: '#/definitions/pgtype.Timestamptz'
      last_seen_at:
        $ref: '#/definitions/pgtype.Timestamptz'
      platform:
        type: string
      token:
        type: string
      user_id:
        type: string
    type: object
  db.Match:
    properties:
      confirmed_at:
        $ref: '#/definitions/pgtype.Timestamptz'
      id:
        type: string
      match_type:
        $ref: '#/definitions/db.MatchType'
      played_at:
        $ref: '#/definitions/pgtype.Timestamptz'
      set1_team1:
        type: integer
      set1_team2:
        type: integer
      set2_team1:
        type: integer
      set2_team2:
        type: integer
      set3_team1:
        $ref: '#/definitions/pgtype.Int4'
      set3_team2:
        $ref: '#/definitions/pgtype.Int4'
      status:
        $ref: '#/definitions/db.MatchStatus'
      submitted_by_id:
        $ref: '#/definitions/pgtype.Text'
      team1_player1_id:
        type: string
      team1_player2_id:
        $ref: '#/definitions/pgtype.Text'
      team2_player1_id:
        type: string
      team2_player2_id:
        $ref: '#/definitions/pgtype.Text'
    type: object
  db.MatchStatus:
    enum:
    - PENDING
    - CONFIRMED
    - CONTESTED
    - CANCELLED
    type: string
    x-enum-varnames:
    - MatchStatusPENDING
    - MatchStatusCONFIRMED
    - MatchStatusCONTESTED
    - MatchStatusCANCELLED
  db.MatchType:
    enum:
    - SINGLES
    - DOUBLES
    - MIXED
    type: string
    x-enum-varnames:
    - MatchTypeSINGLES
    - MatchTypeDOUBLES
    - MatchTypeMIXED
  db.News:
    properties:
      body:
        $ref: '#/definitions/pgtype.Text'
      created_at:
        $ref: '#/definitions/pgtype.Timestamptz'
      created_by:
        $ref: '#/definitions/pgtype.Text'
      emoji:
        type: string
      id:
        type: string
      match_id:
        type: string
      source:
        type: string
      title:
        type: string
    type: object
  db.Notification:
    properties:
      body:
        type: string
      created_at:
        $ref: '#/definitions/pgtype.Timestamptz'
      data:
        items:
          type: integer
        type: array
      id:
        type: string
      read_at:
        $ref: '#/definitions/pgtype.Timestamptz'
      title:
        type: string
      type:
        $ref: '#/definitions/db.NotificationType'
      user_id:
        type: string
    type: object
  db.NotificationType:
    enum:
    - CHALLENGE_RECEIVED
    - CHALLENGE_ACCEPTED
    - CHALLENGE_DECLINED
    - MATCH_AWAITING_CONFIRMATION
    - MATCH_CONFIRMED
    - MATCH_CONTESTED
    type: string
    x-enum-varnames:
    - NotificationTypeCHALLENGERECEIVED
    - NotificationTypeCHALLENGEACCEPTED
    - NotificationTypeCHALLENGEDECLINED
    - NotificationTypeMATCHAWAITINGCONFIRMATION
    - NotificationTypeMATCHCONFIRMED
    - NotificationTypeMATCHCONTESTED
  db.User:
    properties:
      created_at:
        $ref: '#/definitions/pgtype.Timestamptz'
      elo_doubles:
        type: integer
      elo_mixed:
        type: integer
      elo_singles:
        type: integer
      email:
        type: string
      ffbad_rank:
        $ref: '#/definitions/pgtype.Text'
      first_name:
        type: string
      gender:
        $ref: '#/definitions/pgtype.Text'
      id:
        type: string
      last_name:
        type: string
      license_number:
        $ref: '#/definitions/pgtype.Text'
      nickname:
        $ref: '#/definitions/pgtype.Text'
      role:
        type: string
      status:
        $ref: '#/definitions/db.UserStatus'
    type: object
  db.UserStatus:
    enum:
    - pending
    - approved
    - rejected
    type: string
    x-enum-varnames:
    - UserStatusPending
    - UserStatusApproved
    - UserStatusRejected
  handlers.approveRequest:
    properties:
      ffbad_rank:
        description: optional correction, "" leaves unchanged
        type: string
      gender:
        description: optional correction, "" leaves unchanged
        type: string
    type: object
  handlers.createChallengeRequest:
    properties:
      court:
        type: string
      match_type:
        description: optional; defaults to SINGLES (v1 only accepts SINGLES)
        type: string
      note:
        type: string
      proposed_at:
        description: optional ISO-8601
        type: string
      to_user_id:
        type: string
    type: object
  handlers.createMatchRequest:
    properties:
      match_type:
        description: SINGLES | DOUBLES | MIXED
        type: string
      sets:
        description: 2 or 3 sets
        items:
          $ref: '#/definitions/handlers.setScore'
        type: array
      team1_player1_id:
        description: always required
        type: string
      team1_player2_id:
        description: required for DOUBLES / MIXED
        type: string
      team2_player1_id:
        description: always required
        type: string
      team2_player2_id:
        description: required for DOUBLES / MIXED
        type: string
    type: object
  handlers.inviteRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
    type: object
  handlers.inviteResponse:
    properties:
      temp_password:
        type: string
      user:
        $ref: '#/definitions/db.User'
    type: object
  handlers.newsRequest:
    properties:
      body:
        description: optional
        type: string
      emoji:
        type: string
      title:
        type: string
    type: object
  handlers.registerFcmTokenRequest:
    properties:
      platform:
        description: ios | android | web
        type: string
      token:
        type: string
    type: object
  handlers.rosterResponse:
    properties:
      entries:
        items:
          $ref: '#/definitions/db.ClubRoster'
        type: array
      last_synced_at:
        type: string
    type: object
  handlers.setRoleRequest:
    properties:
      admin:
        type: boolean
    type: object
  handlers.setScore:
    properties:
      team1:
        type: integer
      team2:
        type: integer
    type: object
  handlers.syncRequest:
    properties:
      ffbad_rank:
        description: optional, NC | P12 | ... | N1
        type: string
      first_name:
        type: string
      gender:
        description: optional, MALE | FEMALE
        type: string
      last_name:
        type: string
      license_number:
        description: FFBAD licence; matched against the club roster
        type: string
      nickname:
        description: optional handle
        type: string
    type: object
  handlers.updateUserRequest:
    properties:
      email:
        type: string
      ffbad_rank:
        description: '"" | NC | P12 | ... | N1'
        type: string
      first_name:
        type: string
      gender:
        description: '"" | MALE | FEMALE'
        type: string
      last_name:
        type: string
      nickname:
        description: '"" = clear'
        type: string
    type: object
  pgtype.InfinityModifier:
    enum:
    - 1
    - 0
    - -1
    format: int32
    type: integer
    x-enum-varnames:
    - Infinity
    - Finite
    - NegativeInfinity
  pgtype.Int4:
    properties:
      int32:
        format: int32
        type: integer
      valid:
        type: boolean
    type: object
  pgtype.Text:
    properties:
      string:
        type: string
      valid:
        type: boolean
    type: object
  pgtype.Timestamptz:
    properties:
      infinityModifier:
        $ref: '#/definitions/pgtype.InfinityModifier'
      time:
        type: string
      valid:
        type: boolean
    type: object
  services.EloRanking:
    properties:
      elo:
        type: integer
      rank:
        type: integer
      tableau:
        $ref: '#/definitions/db.MatchType'
      user:
        $ref: '#/definitions/db.User'
    type: object
  services.GiantKillerRanking:
    properties:
      rank:
        type: integer
      upset_wins:
        type: integer
      user:
        $ref: '#/definitions/db.User'
    type: object
  services.LeagueRanking:
    properties:
      losses:
        type: integer
      rank:
        type: integer
      sets_diff:
        type: integer
      sets_lost:
        type: integer
      sets_won:
        type: integer
      user:
        $ref: '#/definitions/db.User'
      wins:
        type: integer
    type: object
  services.MatchSet:
    properties:
      mine:
        type: integer
      opp:
        type: integer
    type: object
  services.MatchesPlayedRanking:
    properties:
      matches_played:
        type: integer
      rank:
        type: integer
      user:
        $ref: '#/definitions/db.User'
    type: object
  services.MemberPerformance:
    properties:
      gain_7d:
        type: integer
      rank:
        type: integer
      score:
        type: integer
    type: object
  services.MemberStatsMonth:
    properties:
      losses:
        type: integer
      matches:
        type: integer
      wins:
        type: integer
    type: object
  services.MemberSummary:
    properties:
      elo:
        type: integer
      jerseys:
        items:
          type: string
        type: array
      performance:
        $ref: '#/definitions/services.MemberPerformance'
      stats_month:
        $ref: '#/definitions/services.MemberStatsMonth'
      tableau:
        $ref: '#/definitions/db.MatchType'
      user:
        $ref: '#/definitions/services.ProfileUser'
    type: object
  services.PerformanceRanking:
    properties:
      points:
        type: integer
      rank:
        type: integer
      user:
        $ref: '#/definitions/db.User'
    type: object
  services.ProfileHeadToHead:
    properties:
      favorite_victim:
        $ref: '#/definitions/services.ProfileOpponent'
      nemesis:
        $ref: '#/definitions/services.ProfileOpponent'
    type: object
  services.ProfileHistoryPoint:
    properties:
      date:
        type: string
      value:
        type: integer
    type: object
  services.ProfileOpponent:
    properties:
      losses:
        type: integer
      user:
        $ref: '#/definitions/services.ProfileUser'
      wins:
        type: integer
    type: object
  services.ProfilePerformance:
    properties:
      gain_7d:
        type: integer
      rank:
        type: integer
      score:
        type: integer
    type: object
  services.ProfileStatsMonth:
    properties:
      losses:
        type: integer
      matches:
        type: integer
      streak:
        type: integer
      upset_wins:
        type: integer
      wins:
        type: integer
    type: object
  services.ProfileUser:
    properties:
      first_name:
        type: string
      gender:
        type: string
      id:
        type: string
      joined_year:
        type: integer
      last_name:
        type: string
      nickname:
        type: string
    type: object
  services.RosterSyncResult:
    properties:
      auto_approved:
        type: integer
      errors:
        items:
          type: string
        type: array
      fetched:
        type: integer
      skipped_anonymous:
        type: integer
      upserted:
        type: integer
    type: object
  services.UserMatchHistoryEntry:
    properties:
      elo_change:
        type: integer
      id:
        type: string
      opponent:
        $ref: '#/definitions/services.ProfileUser'
      perf_points:
        type: integer
      played_at:
        type: string
      sets:
        items:
          $ref: '#/definitions/services.MatchSet'
        type: array
      status:
        type: string
      tableau:
        $ref: '#/definitions/db.MatchType'
      won_by_user:
        type: boolean
    type: object
  services.UserProfile:
    properties:
      elo:
        type: integer
      head_to_head:
        $ref: '#/definitions/services.ProfileHeadToHead'
      jerseys:
        items:
          type: string
        type: array
      perf_history:
        items:
          $ref: '#/definitions/services.ProfileHistoryPoint'
        type: array
      performance:
        $ref: '#/definitions/services.ProfilePerformance'
      stats_month:
        $ref: '#/definitions/services.ProfileStatsMonth'
      tableau:
        $ref: '#/definitions/db.MatchType'
      user:
        $ref: '#/definitions/services.ProfileUser'
      yellow_jersey_threshold:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: REST API for the BAP Pulse badminton club app — Bad A Paname.
  title: BAP Pulse API
  version: "1.0"
paths:
  /admin/invite:
    post:
      consumes:
      - application/json
      description: Creates a Firebase user and their profile. Returns a temporary
        password to share with the new user.
      parameters:
      - description: User first name, last name and email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.inviteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.inviteResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Invite a new user
      tags:
      - admin
  /admin/roster:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.rosterResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List the synced club roster
      tags:
      - admin
  /admin/roster/sync:
    post:
      description: Fetches the full club roster (scoped by the club token) and upserts
        it locally. Pending users whose licence now appears are auto-approved.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.RosterSyncResult'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Sync the club roster from the FFBAD API
      tags:
      - admin
  /admin/users/{uid}/approve:
    post:
      consumes:
      - application/json
      description: Flips the user to approved. Optionally corrects gender/FFBAD rank
        (FFBAD data may be stale or missing). If the user hasn't played a match yet,
        the starting ELO is recomputed from the corrected rank/gender.
      parameters:
      - description: Firebase UID of the target user
        in: path
        name: uid
        required: true
        type: string
      - description: Optional profile corrections
        in: body
        name: body
        schema:
          $ref: '#/definitions/handlers.approveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/db.User'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Approve a pending user
      tags:
      - admin
  /admin/users/{uid}/reject:
    post:
      parameters:
      - description: Firebase UID of the target user
        in: path
        name: uid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/db.User'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Reject a pending user
      tags:
      - admin
  /admin/users/{uid}/role:
    post:
      consumes:
      - application/json
      description: Updates the user's role in the database. Takes effect immediately
        on the next request (no token refresh needed).
      parameters:
      - description: Firebase UID of the target user
        in: path
        name: uid
        required: true
        type: string
      - description: Role payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.setRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/db.User'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Grant or revoke admin role
      tags:
      - admin
  /admin/users/pending:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/db.User'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List users awaiting validation
      tags:
      - admin
  /auth/sync:
    post:
      consumes:
      - application/json
      description: 'Called after a successful Firebase login. On first login it creates
        the profile: if the FFBAD licence matches the club roster the account is auto-approved
        and prefilled (name/gender/rank/ELO from FFBAD), otherwise it is left pending
        for admin validation. Returns the existing profile on subsequent calls.'
      parameters:
      - description: Profile fields + FFBAD licence (first login)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.syncRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/db.User'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/db.User'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Sync user profile
      tags:
      - auth
  /challenges:
    get:
      description: Returns both received and sent challenges, most recent first.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/db.Challenge'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List challenges involving the authenticated user
      tags:
      - challenges
    post:
      consumes:
      - application/json
      description: v1 only supports SINGLES (one challenger, one challenged). The
        recipient receives a push notification and can accept/decline.
      parameters:
      - description: Challenge payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.createChallengeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/db.Challenge'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Challenge another player
      tags:
      - challenges
  /challenges/{id}/accept:
    post:
      parameters:
      - description: Challenge ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/db.Challenge'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Accept a challenge
      tags:
      - challenges
  /challenges/{id}/cancel:
    post:
      parameters:
      - description: Challenge ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/db.Challenge'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cancel a challenge you sent
      tags:
      - challenges
  /challenges/{id}/decline:
    post:
      parameters:
      - description: Challenge ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/db.Challenge'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Decline a challenge
      tags:
      - challenges
  /matches:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/db.Match'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List confirmed matches
      tags:
      - matches
    post:
      consumes:
      - application/json
      description: Creates a PENDING match. ELO and performance points are NOT yet
        applied — they will be on confirmation by the opposing team. The opposing
        team is notified.
      parameters:
      - description: Match details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.createMatchRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/db.Match'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Submit a match score for confirmation
      tags:
      - matches
  /matches/{id}:
    get:
      parameters:
      - description: Match ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/db.Match'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get a match
      tags:
      - matches
  /matches/{id}/confirm:
    post:
      description: Applies ELO + performance points and emits the match-confirmed
        news. Caller must be a member of the team opposite to the submitter.
      parameters:
      - description: Match ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Confirm a pending match score
      tags:
      - matches
  /matches/{id}/contest:
    post:
      description: Marks the match CONTESTED. ELO is not applied. The submitter is
        notified.
      parameters:
      - description: Match ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/db.Match'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Contest a pending match score
      tags:
      - matches
  /members:
    get:
      description: Returns the full membership, each enriched with monthly performance
        (score, rank, 7-day gain), monthly W/L/M and currently held jerseys. Same
        aggregation window/tableau as the /rankings/* family.
      parameters:
      - description: SINGLES (default) | DOUBLES | MIXED
        in: query
        name: tableau
        type: string
      - description: 'YYYY-MM (default: current month)'
        in: query
        name: period
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/services.MemberSummary'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Members roster with monthly stats and jerseys
      tags:
      - members
  /news:
    get:
      description: Latest first. Anyone authenticated can read.
      parameters:
      - description: Max items to return (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: Pagination offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/db.News'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List news
      tags:
      - news
    post:
      consumes:
      - application/json
      description: Admin only. The created news has source = "MANUAL".
      parameters:
      - description: News payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.newsRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/db.News'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a manual news item
      tags:
      - news
  /news/{id}:
    delete:
      description: Admin only.
      parameters:
      - description: News ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a news item
      tags:
      - news
    get:
      parameters:
      - description: News ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/db.News'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get a news item
      tags:
      - news
    put:
      consumes:
      - application/json
      description: Admin only. Updates emoji, title and body. Source and references
        are immutable.
      parameters:
      - description: News ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: News payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.newsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/db.News'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update a news item
      tags:
      - news
  /notifications:
    get:
      description: Paginated, most recent first. Includes both read and unread.
      parameters:
      - description: Max items to return (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: Pagination offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/db.Notification'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List notifications for the authenticated user
      tags:
      - notifications
  /notifications/{id}/read:
    post:
      parameters:
      - description: Notification ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/db.Notification'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Mark a notification as read
      tags:
      - notifications
  /notifications/read-all:
    post:
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Mark all the caller's notifications as read
      tags:
      - notifications
  /notifications/unread-count:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              format: int64
              type: integer
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Count unread notifications for the authenticated user
      tags:
      - notifications
  /rankings:
    get:
      description: Use /rankings/elo?tableau=... for new clients.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/services.EloRanking'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: ELO leaderboard (legacy — defaults to SINGLES)
      tags:
      - rankings
  /rankings/elo:
    get:
      parameters:
      - description: SINGLES (default) | DOUBLES | MIXED
        in: query
        name: tableau
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/services.EloRanking'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: ELO leaderboard for a tableau
      tags:
      - rankings
  /rankings/giant-killer:
    get:
      description: Wins against an opponent whose ELO at match time exceeded the player's
        by at least UpsetThreshold.
      parameters:
      - description: SINGLES (default) | DOUBLES | MIXED
        in: query
        name: tableau
        type: string
      - description: 'YYYY-MM (default: current month)'
        in: query
        name: period
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/services.GiantKillerRanking'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Giant-killer ranking
      tags:
      - rankings
  /rankings/league:
    get:
      parameters:
      - description: SINGLES (default) | DOUBLES | MIXED
        in: query
        name: tableau
        type: string
      - description: 'YYYY-MM (default: current month)'
        in: query
        name: period
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/services.LeagueRanking'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: League ranking (wins / losses / sets)
      tags:
      - rankings
  /rankings/matches-played:
    get:
      parameters:
      - description: SINGLES (default) | DOUBLES | MIXED
        in: query
        name: tableau
        type: string
      - description: 'YYYY-MM (default: current month)'
        in: query
        name: period
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/services.MatchesPlayedRanking'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Matches-played ranking
      tags:
      - rankings
  /rankings/performance:
    get:
      description: Sum of performance points awarded during the period for the tableau.
      parameters:
      - description: SINGLES (default) | DOUBLES | MIXED
        in: query
        name: tableau
        type: string
      - description: 'YYYY-MM (default: current month)'
        in: query
        name: period
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/services.PerformanceRanking'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Performance ranking (yellow jersey)
      tags:
      - rankings
  /users:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/db.User'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List all users
      tags:
      - users
  /users/{id}:
    delete:
      description: Users can only delete their own account. Admins can delete any
        account.
      parameters:
      - description: User ID (Firebase UID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete user account
      tags:
      - users
    get:
      parameters:
      - description: User ID (Firebase UID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/db.User'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get a user
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Users can only update their own profile. Admins can update any
        profile.
      parameters:
      - description: User ID (Firebase UID)
        in: path
        name: id
        required: true
        type: string
      - description: Updated user data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.updateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/db.User'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update user profile
      tags:
      - users
  /users/{id}/matches:
    get:
      description: Returns the user's SINGLES matches sorted DESC by played_at, reshaped
        from the user's perspective (sets as mine vs opp, signed ELO delta).
      parameters:
      - description: User ID (Firebase UID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/services.UserMatchHistoryEntry'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List a user's match history
      tags:
      - users
  /users/{id}/profile:
    get:
      description: Singles-only for the MVP. Returns ELO, monthly perf score + rank,
        7-day perf gain, monthly stats (matches/wins/losses/upsets/streak), held jerseys,
        yellow-jersey threshold, daily perf-history sparkline, and head-to-head (nemesis
        + favorite victim).
      parameters:
      - description: User ID (Firebase UID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.UserProfile'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Aggregated profile payload for the mobile profile screen
      tags:
      - users
  /users/me/fcm-tokens:
    post:
      consumes:
      - application/json
      description: Upserts the token, binding it to the authenticated user. Called
        by the mobile app at login and on FCM token refresh.
      parameters:
      - description: Token payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.registerFcmTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/db.FcmToken'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Register a device FCM token
      tags:
      - fcm
  /users/me/fcm-tokens/{token}:
    delete:
      description: Called by the mobile app on logout. Only deletes the token if it
        belongs to the authenticated user.
      parameters:
      - description: FCM token
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Unregister a device FCM token
      tags:
      - fcm
securityDefinitions:
  BearerAuth:
    description: 'Firebase ID Token — format: Bearer <token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
